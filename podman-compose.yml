version: "3.8"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    depends_on:
      - jaeger

  # Image tag must match backend/requirements.txt's `ladybug` version -- the
  # explorer and the embedded library have to agree on storage format.
  ladybug-explorer:
    image: ghcr.io/ladybugdb/explorer:0.19.1
    ports:
      - "8001:8000"
    environment:
      - LBUG_FILE=graph.ladybugdb
      - MODE=READ_ONLY
    volumes:
      - ./backend/data/graph:/database
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
