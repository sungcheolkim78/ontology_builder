version: "3.8"

services:
  # LLM tracing goes to a self-hosted Langfuse server that is NOT part of
  # this compose file -- it's a separate, shared instance for this
  # machine's projects. See docs/LANGFUSE.md. backend/.env's
  # LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY/LANGFUSE_HOST wire this
  # container up to it (LANGFUSE_HOST is typically
  # http://host.containers.internal:3000).
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data

  # Image tag must match backend/requirements.txt's `ladybug` version -- the
  # explorer and the embedded library have to agree on storage format.
  ladybug-explorer:
    image: ghcr.io/ladybugdb/explorer:0.19.1
    ports:
      - "8001:8000"
    environment:
      - LBUG_FILE=graph.ladybugdb
      - MODE=READ_ONLY
    volumes:
      - ./backend/data/graph:/database
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
